spring:
  application:
    name: HelloSpring

  datasource:
    url: jdbc:mysql://${ISI_DB_HOSTNAME}:${ISI_DB_PORT}/${ISI_DB_NAME}
    username: ${ISI_DB_USER}
    password: ${ISI_DB_PWD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${ISI_DDL_AUTO:create}

groupeisi:
  gl:
    responsable:
      prenom: ${RESPONSABLE_PRENOM:claye}
      nom: ${RESPONSABLE_NOM:Ndiaye}
      email: ${RESPONSABLE_EMAIL:clayendaye@groupeisi.com}
