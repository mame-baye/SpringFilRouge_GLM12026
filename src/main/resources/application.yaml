spring:
  application:
    name: HelloSpring

  datasource:
    url: jdbc:${ISI_DB_drive:postgresql}://${ISI_DB_HOSTNAME}:${ISI_DB_PORT:5432}/${ISI_DB_NAME:isi_testev}
    username: ${ISI_DB_USER:postgres}
    password: ${ISI_DB_PWD:passer}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  profiles:
    active: ${profil:postgre}


server:
  port: 8086

groupeisi:
  gl:
    responsable:
      prenom: ${RESPONSABLE_PRENOM:claye}
      nom: ${RESPONSABLE_NOM:Ndiaye}
      email: ${RESPONSABLE_EMAIL:clayendaye@groupeisi.com}
